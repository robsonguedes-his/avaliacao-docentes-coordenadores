.phead{position:sticky;top:0;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh);margin-bottom:12px}
.phead h2{margin:0;font-size:19px}.phead .meta2{color:var(--mut);font-size:12.5px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:0}
.tabs button{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;background:var(--card);color:var(--ink)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
:root[data-theme=dark] .tabs button.on{color:#12161d}
.box{border-radius:16px;box-shadow:var(--sh)}
.box h2{font-size:16px;display:flex;align-items:center;gap:8px}
.kpi2>div{border-radius:16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi2 .v{display:flex;align-items:center;gap:12px}
.gauge{display:flex;align-items:center;gap:14px}
.dimrow{display:grid;grid-template-columns:190px 1fr;gap:10px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dimrow:first-child{border-top:0}
.dimrow .dn{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13.5px}.dimrow .dn small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.dimrow .dn .bub{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none}
.bl .t{height:10px}
.radwrap{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:18px;align-items:center}
@media(max-width:820px){.radwrap{grid-template-columns:1fr}.dimrow{grid-template-columns:1fr}}
.heat td.hc{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.hc.at{background:var(--atb)}.hc.ad{background:var(--adb)}.hc.ok{background:var(--okb)}
.insight{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;margin:6px 0;font-size:13px}
.insight.ok{background:var(--okb)}.insight.at{background:var(--adb)}.insight.dv{background:color-mix(in srgb,var(--c3) 9%,var(--card))}
.insight .ii{font-size:17px;line-height:1.2}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.cols2{grid-template-columns:1fr}}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:8px}
.srcgrid div{border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px}
.srcgrid b{display:block;font-size:12.5px}.srcgrid .pill{margin-top:4px}
.vcomp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.vcomp div{border-radius:12px;background:color-mix(in srgb,var(--c3) 9%,var(--card));padding:8px 10px;font-size:12px}.vcomp b{display:block;font-size:17px}
.foot a,.footlink{color:var(--acc);cursor:pointer;text-decoration:underline}
.sctr,.radsvg{max-width:100%}
.print-hide{}
@media print{header{display:none}.phead{position:static;box-shadow:none}}
.pcard h3{color:var(--ink)}.pc-top h3 span{color:inherit}
.c-f i{background:var(--d2)}.lg .cf:before{background:var(--d2)}
.bl .rd{font-size:11.5px;color:var(--mut);margin-top:3px}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
.duo>div{background:color-mix(in srgb,var(--c1,#2a5da8) 7%,transparent);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column}
.duo span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.duo b{font-size:19px;line-height:1.2}.duo b.ok{color:var(--ok)}.duo b.ad{color:var(--ad)}.duo b.at{color:var(--at)}.duo b.na{color:var(--mut)}
.calcbtn{margin-top:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:12.5px}
.calcbtn:hover{border-color:var(--c1,#2a5da8);color:var(--c1,#2a5da8)}
.mc.calc h3{margin:14px 0 4px}.mc.calc .box{margin-top:12px}
@media print{.calcbtn{display:none}}
.duo b{background:none!important;padding:0!important}
.duo b{background:none!important;padding:0!important}

@keyframes wmfloat{to{transform:translateY(-52%) rotate(1.5deg)}}
header{background:rgba(2,36,66,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header img.brasao{height:36px;width:auto;background:#f4ebd4;padding:5px 7px;border-radius:10px}
h1,h2,.hero h2{font-family:Manrope,Inter,sans-serif;letter-spacing:-.01em}
#th{display:none}
.tag{background:rgba(244,235,212,.14);color:#f4ebd4}.tag.at{background:rgba(168,70,90,.35);color:#ffd9d2}
nav.main{background:rgba(2,36,66,.78);backdrop-filter:blur(10px)}
button,.btn{background:rgba(244,235,212,.06)}
button.on,.seg button.on,.tabs button.on{background:#f4ebd4;color:#551c25;border-color:#f4ebd4}
.seg button.on{color:#551c25}
.seg{background:rgba(244,235,212,.06)}
.box,.pcard,.pc,.kpis div{background:rgba(10,47,82,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-color:var(--line)}
.hero{background:linear-gradient(120deg,rgba(85,28,37,.92) 0%,rgba(2,36,66,.92) 70%,rgba(19,52,43,.9) 130%);border:1px solid rgba(244,235,212,.2)}
.hero p,.hero .hk span{color:#e8e0c8}
.hero .hk div{background:rgba(244,235,212,.1);border-color:rgba(244,235,212,.25)}
.avt{background:#551c25;color:#f4ebd4}
input,select{background:rgba(244,235,212,.08);color:var(--ink);border:1px solid var(--line)}
select option{background:#0a2f52;color:#f4ebd4}
/* nota do Índice Final pulsando */
svg[role=img][aria-label^="Nota"]{overflow:visible;transform-origin:center;animation:notaPulse 2.6s ease-in-out infinite;filter:drop-shadow(0 0 0 rgba(244,235,212,0))}
.pcard:nth-child(3n+2) svg[role=img]{animation-delay:-.9s}.pcard:nth-child(3n) svg[role=img]{animation-delay:-1.7s}
@keyframes notaPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(244,235,212,0))}45%{transform:scale(1.09);filter:drop-shadow(0 0 9px rgba(244,235,212,.45))}60%{transform:scale(.99)}}
.pcard svg[role=img]:hover{animation-duration:.8s}
}
@media screen and (prefers-reduced-motion:reduce){body::after{animation:none}svg[role=img][aria-label^="Nota"]{animation:none}}
@media print{body::before,body::after{display:none}svg[role=img]{animation:none!important;filter:none!important}}
.ph{font-size:18px;margin:4px 0 10px}
.gt{font-size:15px;margin:16px 0 8px}.gt small{color:var(--mut);font-weight:500}
.fbar .sp{flex:1}
.pcard{cursor:pointer}
.pcard .ml{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.brow{display:grid;grid-template-columns:minmax(120px,210px) 1fr 84px;gap:10px;align-items:center;font-size:13px}
.brow .bl{display:block}
.brow .bt{position:relative;height:12px;border-radius:99px;background:rgba(127,127,127,.18);overflow:hidden}
.brow .bt i{display:block;height:100%;border-radius:99px;transition:width .5s}
.brow .bt u{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--mut);opacity:.7}
.brow .bv{text-align:right}.brow .bv small{display:block;color:var(--mut);font-size:11px}
td.clk,tr.clk{cursor:pointer}tr.clk:hover td{filter:brightness(1.08)}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px}
td.n{font-variant-numeric:tabular-nums}
.wrap td{vertical-align:top}
.cover-back{margin-left:8px}
@media(max-width:700px){.brow{grid-template-columns:1fr 70px}.brow .bl{grid-column:1/-1}}
.wrap.tq td:nth-child(2){min-width:360px}.wrap.tq td:nth-child(1){min-width:120px}

/* ===== tabelas que cabem na largura (sem rolagem, sem corte na impressão) ===== */
.wrap{overflow:visible}
.wrap table{width:100%;table-layout:auto}
.wrap th,.wrap td{padding:5px 6px}
td.n,th.n{white-space:normal}
.wrap th{font-size:10.5px;line-height:1.2;overflow-wrap:anywhere}
.wrap td{font-size:12px;overflow-wrap:anywhere}
.wrap.tq td:nth-child(1),.wrap.tq td:nth-child(2){min-width:0}
.wrap.tq th:nth-child(1){width:12%}.wrap.tq th:nth-child(2){width:25%}.wrap.tq th:nth-child(11){width:12%}
.wrap.tq th:nth-child(n+3):nth-child(-n+10){width:6.5%}
.wrap .chip{white-space:normal;display:inline-block;line-height:1.2;text-align:center}
.rtab th,.rtab td{white-space:normal}
@media(max-width:760px){.wrap{overflow:auto}}
@media print{
.wrap{overflow:visible!important;break-inside:auto}
.wrap table{font-size:9.5px!important}
.wrap th{font-size:8.5px!important}.wrap td{font-size:9.5px!important}
.wrap th,.wrap td{padding:3px 4px!important}
tr{break-inside:avoid}
}
.wrap.tq td:nth-child(1){overflow-wrap:break-word}

/* ===== TEMA CLARO (padrão) ===== */

:root[data-theme=light] header img.brasao{background:#551c25}
:root[data-theme=light] .tag{background:#e8eefb;color:#1f3a5f}
:root[data-theme=light] .tag.at{background:#fde3df;color:#9b1c1c}
:root[data-theme=light] nav.main{background:rgba(255,255,255,.86)}
:root[data-theme=light] button,:root[data-theme=light] .btn{background:#fff}
:root[data-theme=light] button.on,:root[data-theme=light] .seg button.on,:root[data-theme=light] .tabs button.on{background:#551c25;color:#fff;border-color:#551c25}
:root[data-theme=light] .seg{background:#fff}
:root[data-theme=light] .box,:root[data-theme=light] .pcard,:root[data-theme=light] .pc,:root[data-theme=light] .kpis div{background:rgba(255,255,255,.93);border-color:var(--line);box-shadow:var(--sh)}
:root[data-theme=light] .hero{background:linear-gradient(120deg,#551c25 0%,#022442 62%,#13342b 130%);border:0;color:#fff}
:root[data-theme=light] .hero p,:root[data-theme=light] .hero .hk span{color:#f0e8d2}
:root[data-theme=light] .hero .hk div{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.28)}
:root[data-theme=light] .avt{color:#fff}
:root[data-theme=light] input,:root[data-theme=light] select{background:#fff;color:var(--ink);border:1px solid var(--line)}
:root[data-theme=light] select option{background:#fff;color:#14213a}
:root[data-theme=light] svg[role=img][aria-label^="Nota"]{animation:notaPulseL 2.6s ease-in-out infinite}
@keyframes notaPulseL{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(47,109,181,0))}45%{transform:scale(1.09);filter:drop-shadow(0 0 8px rgba(47,109,181,.45))}60%{transform:scale(.99)}}
:root[data-theme=light] th{background:#e6eefa;color:#14213a}
:root[data-theme=light] .ph{color:#14213a}
:root[data-theme=light] tr:nth-child(even) td{background-color:rgba(47,109,181,.04)}
/* ===== CORES ===== */
.hero .hk div:nth-child(1){background:rgba(47,109,181,.55)!important}
.hero .hk div:nth-child(2){background:rgba(217,115,26,.55)!important}
.hero .hk div:nth-child(3){background:rgba(19,135,95,.6)!important}
.hero .hk div:nth-child(4){background:rgba(185,85,143,.55)!important}
.hero .hk div:nth-child(5){background:rgba(122,79,176,.55)!important}
.hero .hk div:nth-child(6){background:rgba(201,162,39,.55)!important}
.hero .hk div{border-color:rgba(255,255,255,.35)!important}
.box{border-top:4px solid var(--bc,var(--c1))}
.box:nth-of-type(6n+1){--bc:#2f6db5}.box:nth-of-type(6n+2){--bc:#d9731a}.box:nth-of-type(6n+3){--bc:#13875f}.box:nth-of-type(6n+4){--bc:#b9558f}.box:nth-of-type(6n+5){--bc:#7a4fb0}.box:nth-of-type(6n+6){--bc:#c9a227}
.tabs button[data-tab=rank]{--tc:#c9a227}.tabs button[data-tab=us]{--tc:#2f6db5}.tabs button[data-tab=bl]{--tc:#13875f}.tabs button[data-tab=ind]{--tc:#b9558f}.tabs button[data-tab=rad]{--tc:#7a4fb0}.tabs button[data-tab=par]{--tc:#d9731a}
.tabs button{border-bottom:3px solid var(--tc,var(--line))!important}
.gt{border-left:6px solid var(--gc,#2f6db5);padding-left:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.lg2{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12.5px;margin-top:4px}.lg2 i{display:inline-block;width:16px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.radwrap{max-width:640px;margin:0 auto}.radsvg{width:100%;height:auto;overflow:visible}
.actbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px;padding:10px 12px;border-radius:14px;background:linear-gradient(90deg,rgba(47,109,181,.12),rgba(185,85,143,.12),rgba(217,115,26,.12));border:1px solid var(--line)}
.actbar>span{font-weight:700;margin-right:4px}
button.act{border:0;color:#fff;font-weight:700;border-radius:999px;padding:7px 14px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
button.act:hover{filter:brightness(1.1);transform:translateY(-1px)}
button.act.rel{background:#2f6db5}button.act.fb{background:#13875f}button.act.pdi{background:#d9731a}
.mini-act{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.mini-act button.act{padding:4px 10px;font-size:12px}
.pcard .chip:nth-child(1){background:rgba(47,109,181,.16);color:var(--c1)}.pcard .chip:nth-child(2){background:rgba(19,135,95,.16);color:var(--ok)}
.hk b{font-size:24px}
@media print{.actbar,.mini-act{display:none}}
:root[data-theme=light] header h1,:root[data-theme=light] header #th,:root[data-theme=light] header .btn{color:#14213a!important}
:root[data-theme=light] header small{color:#5a6578!important}
:root[data-theme=light] .fbar .lb{color:#5a6578}
.radwrap{display:block!important;max-width:760px}.radsvg{min-height:420px}
@media print{.wrap{overflow:visible!important}table{font-size:10.5px}}

  if(S.q){const q=S.q.toLowerCase();L=L.filter(c=>(c.nome+' '+c.fun+' '+c.un.join(' ')).toLowerCase().includes(q))}
  const k=S.sort;L=L.slice().sort((a,b)=>k==='nome'?a.nome.localeCompare(b.nome):k==='fav'?b.fav-a.fav:k==='med'?b.med-a.med:k==='npsa'?a.nps-b.nps:b.nps-a.nps);return L}
function pooled(L){const n=L.reduce((s,c)=>s+c.n,0);return n?{n,nps:L.reduce((s,c)=>s+c.nps*c.n,0)/n,fav:L.reduce((s,c)=>s+c.fav*c.n,0)/n,med:L.reduce((s,c)=>s+c.med*c.n,0)/n}:{n:0,nps:null,fav:null,med:null}}
/* ---- 1. ranking ---- */
function cardC(c){const cl=tcls(c.nps);
  return '<div class="pcard '+cl+'" data-open="'+esc(c.nome)+'" tabindex="0" role="button" aria-label="Abrir análise de '+esc(tc(c.nome))+'"><div class="pc-top"><div class="avt" style="background:'+FC[c.fun]+';color:#fff">'+ini(c.nome)+'</div><div><h3>'+esc(nomeCurto(c.nome))+'</h3><small>'+esc(c.fun)+' · '+esc(c.un.join(', '))+'</small></div><div class="ringw">'+ring(c.nps,60,6)+'<small>NPS</small></div></div>'
  +'<div class="duo"><div><span>% favorável</span><b class="'+(c.fav>=.9?'ok':c.fav>=.8?'ad':'at')+'">'+pc(c.fav)+'</b></div><div><span>Média (1–5)</span><b>'+nf(c.med,2)+'</b></div></div>'
  +'<div class="ml"><span class="chip">'+c.rank+'º de '+c.rankN+' na função</span><span class="chip">'+c.np_+' professores</span><span class="chip">Δ '+sg(c.dnps,1)+' vs. função</span>'+alertChip(c.alerta)+'</div><div class="mini-act"><button class="act rel" data-doc="rel" data-n="'+esc(c.nome)+'">📄 Relatório</button><button class="act fb" data-doc="fb" data-n="'+esc(c.nome)+'">🗣️ Roteiro</button><button class="act pdi" data-doc="pdi" data-n="'+esc(c.nome)+'">🎯 PDI-SMART</button></div></div>'}
function tRank(L){const hs=scale3(L.map(c=>c.nps)),hf=scale3(L.map(c=>c.fav)),hm=scale3(L.map(c=>c.med));
  return T(['~Função','~Avaliado','~Unidade(s)','Nº professores','Respostas válidas','NPS','% Favorável','Média (1–5)','Ranking na função (NPS)','Δ NPS vs. função','~Alerta'],L.map(c=>'<tr class="clk" data-open="'+esc(c.nome)+'"><td>'+esc(c.fun)+'</td><td><b>'+esc(tc(c.nome))+'</b></td><td>'+esc(c.un.join(', '))+'</td><td class="n">'+c.np_+'</td><td class="n">'+c.n+'</td><td class="n" style="'+hs(c.nps)+'">'+nf(c.nps,1)+'</td><td class="n" style="'+hf(c.fav)+'">'+pc(c.fav)+'</td><td class="n" style="'+hm(c.med)+'">'+nf(c.med,2)+'</td><td class="n">'+c.rank+'</td><td class="n">'+sg(c.dnps,1)+'</td><td>'+alertChip(c.alerta)+'</td></tr>'))}
function vRank(){const L=listCoords(),P=pooled(D.coords.filter(c=>(!S.fun||c.fun===S.fun)&&(!S.un||c.un.includes(S.un)))),ndl=D.coords.filter(c=>c.des&&(!S.fun||c.fun===S.fun)&&(!S.un||c.un.includes(S.un))).length,al=L.filter(c=>c.alerta).length;
  let h='<div class="hero"><div><h2>Avaliação dos coordenadores pelos professores</h2><p>Resultado em NPS (−100 a +100), % favorável (Sempre + Quase sempre) e média de 1 a 5. “Não Aplicável” e respostas duplicadas ficam de fora. Os professores que avaliam não são identificados.'+(ndl?' As médias incluem '+ndl+' coordenador'+(ndl>1?'es desligados':' desligado')+', que não aparece'+(ndl>1?'m':'')+' na lista.':'')+'</p></div><div class="hk"><div><b>'+L.length+'</b><span>coordenadores</span></div><div><b>'+sg(P.nps,1)+'</b><span>NPS (ponderado)</span></div><div><b>'+pc(P.fav)+'</b><span>favorável</span></div><div><b>'+nf(P.med,2)+'</b><span>média (1–5)</span></div><div><b>'+P.n+'</b><span>respostas válidas</span></div><div><b>'+al+'</b><span>com amostra pequena</span></div></div></div>';
  h+='<div class="fbar"><span class="lb">Função</span>'+segb('fun',[['','Todas'],...FUNS.map(f=>[f,f.replace('Coord. ','')])],S.fun)+'<span class="lb">Ordenar</span>'+sel('sort',[['nps','NPS (maior primeiro)'],['npsa','NPS (menor primeiro)'],['fav','% favorável'],['med','Média (1–5)'],['nome','Nome (A–Z)']],S.sort)+'<input type="search" data-f="q" placeholder="Buscar coordenador" value="'+esc(S.q)+'" style="min-width:200px"><span class="sp"></span>'+segb('lv',[['cards','▦ Cards'],['tab','☰ Tabela']],S.lv)+'</div>';
  if(!L.length)return h+'<div class="note">Nenhum coordenador com esses filtros.</div>';
  if(S.lv==='tab')h+=tRank(L);else if(S.fun||S.q)h+='<div class="pcards">'+L.map(cardC).join('')+'</div>';
  else FUNS.forEach(f=>{const x=L.filter(c=>c.fun===f);if(x.length)h+='<h3 class="gt">'+esc(f)+' <small>('+x.length+')</small></h3><div class="pcards">'+x.map(cardC).join('')+'</div>'});
  h+='<div class="note">Alerta “Amostra pequena” = menos de '+D.params.min+' professores avaliadores. Δ NPS = NPS do avaliado − NPS de todos os avaliados da função. Unidade filtrada = coordenadores que atuam nela (os números são gerais do avaliado; veja “Por unidade e segmento” para o recorte). Cor do cartão: ≥ 50 verde, 0 a 49 amarelo, abaixo de 0 vermelho (apoio visual do painel).</div>';
  h+='<div class="box"><h2>Referência da rede por função</h2><p class="foot">Totais e médias incluem as notas de '+NDES+' coordenadores desligados, que não aparecem nas listas.</p>'+T(['~Função','Nº avaliados','Nº professores','Respostas válidas','NPS','% Favorável','Média (1–5)'],D.fun.map(f=>'<tr><td><b>'+esc(f.fun)+'</b></td><td class="n">'+f.nav+'</td><td class="n">'+f.np_+'</td><td class="n">'+f.n+'</td><td class="n">'+nf(f.nps,1)+'</td><td class="n">'+pc(f.fav)+'</td><td class="n">'+nf(f.med,2)+'</td></tr>').concat(['<tr><td><b>Total geral</b></td><td class="n"><b>'+D.tot.nav+'</b></td><td class="n"><b>'+D.tot.np_+'</b></td><td class="n"><b>'+D.tot.n+'</b></td><td class="n"><b>'+nf(D.tot.nps,1)+'</b></td><td class="n"><b>'+pc(D.tot.fav)+'</b></td><td class="n"><b>'+nf(D.tot.med,2)+'</b></td></tr>']))+'</div>';
  return h}
/* ---- 2. unidade-segmento ---- */
function vUS(){const L=D.us.filter(u=>!COORD[u.nome].des&&(!S.usFun||u.fun===S.usFun)&&(!S.usUn||u.un===S.usUn));const hs=scale3(L.map(u=>u.nps)),hd=scale3(L.map(u=>u.d),0),hf=scale3(L.map(u=>u.fav)),hm=scale3(L.map(u=>u.med));
  let h='<h2 class="ph">Desempenho por unidade e segmento</h2><div class="fbar"><span class="lb">Função</span>'+segb('usFun',[['','Todas'],...FUNS.map(f=>[f,f.replace('Coord. ','')])],S.usFun)+'</div>';
  h+=T(['~Função','~Avaliado','~Unidade','~Segmento','Nº professores','Respostas válidas','NPS','% Favorável','Média (1–5)','Δ NPS vs. geral do avaliado','~Alerta'],L.map(u=>'<tr class="clk" data-open="'+esc(u.nome)+'"><td>'+esc(u.fun)+'</td><td><b>'+esc(tc(u.nome))+'</b></td><td>'+esc(u.un)+'</td><td>'+esc(u.seg)+'</td><td class="n">'+u.np_+'</td><td class="n">'+u.n+'</td><td class="n" style="'+hs(u.nps)+'">'+nf(u.nps,1)+'</td><td class="n" style="'+hf(u.fav)+'">'+pc(u.fav)+'</td><td class="n" style="'+hm(u.med)+'">'+nf(u.med,2)+'</td><td class="n" style="'+hd(u.d)+'">'+sg(u.d,1)+'</td><td>'+alertChip(u.alerta)+'</td></tr>'));
  return h+'<div class="note">Δ NPS = NPS no recorte − NPS geral do avaliado. Alerta quando o recorte tem menos de '+D.params.min+' professores. Clique em uma linha para abrir a análise individual.</div>'}
/* ---- 3. bloco ---- */
function vBL(){const L=D.bl.filter(b=>COORD[b.nome]&&!COORD[b.nome].des&&(!S.blFun||b.fun===S.blFun)&&(!S.bsel||b.nome===S.bsel));
  const names=ACT.filter(c=>!S.blFun||c.fun===S.blFun).map(c=>[c.nome,tc(c.nome)+' · '+c.fun]);
  let h='<h2 class="ph">Desempenho por bloco do questionário</h2><div class="fbar"><span class="lb">Função</span>'+segb('blFun',[['','Todas'],...FUNS.map(f=>[f,f.replace('Coord. ','')])],S.blFun)+'<span class="lb">Avaliado</span>'+sel('bsel',[['','Todos (tabela completa)'],...names],S.bsel)+'</div>';
  if(S.bsel){h+='<div class="box"><h2>'+esc(tc(S.bsel))+'</h2><div class="bars">'+L.map(b=>{const w=(b.nps+100)/2;return '<div class="brow"><div class="bl"><i class="dot" style="background:'+BCOL[(bnum(b.bloco)-1+9)%9]+'"></i>'+esc(bshort(b.bloco))+'</div><div class="bt"><i style="width:'+w+'%;background:'+BCOL[(bnum(b.bloco)-1+9)%9]+'"></i><u></u></div><div class="bv"><b>'+sg(b.nps,0)+'</b><small>Δ '+sg(b.d,1)+'</small></div></div>'}).join('')+'</div><p class="foot">Barra: NPS de −100 (esquerda) a +100 (direita); a marca central é o zero. Δ = NPS do bloco − NPS geral do avaliado (negativo = ponto de melhoria relativo).</p></div>'}
  const hs=scale3(L.map(b=>b.nps)),hd=scale3(L.map(b=>b.d),0),hf=scale3(L.map(b=>b.fav)),hm=scale3(L.map(b=>b.med));
  h+=T(['~Função','~Avaliado','~Bloco','Nº professores','Respostas válidas','NPS','% Favorável','Média (1–5)','Δ NPS vs. geral do avaliado'],L.map(b=>'<tr><td>'+esc(b.fun)+'</td><td>'+esc(tc(b.nome))+'</td><td>'+esc(b.bloco)+'</td><td class="n">'+b.np_+'</td><td class="n">'+b.n+'</td><td class="n" style="'+hs(b.nps)+'">'+nf(b.nps,1)+'</td><td class="n" style="'+hf(b.fav)+'">'+pc(b.fav)+'</td><td class="n" style="'+hm(b.med)+'">'+nf(b.med,2)+'</td><td class="n" style="'+hd(b.d)+'">'+sg(b.d,1)+'</td></tr>'));
  return h}
/* ---- 4. individual ---- */
const RESP=['Sempre','Quase sempre','Às vezes','Raramente','Nunca','Não Aplicável'];
function recsFor(c,I){const k=c.nome.startsWith('BERTA')?'BERTA':c.nome.startsWith('MICHELLE')?'MICHELLE':null;
  const fill=s=>String(s).replace(/\{ndest\}/g,I.ndest).replace(/\{share\}/g,Math.round(I.shareneg*100)).replace(/\{G\}/g,I.G).replace(/\{E\}/g,I.E).replace(/\{S\}/g,I.S);
  const first=tc(c.nome).split(' ')[0];let h='';
  if(k){const R=REC[k];
    if(R.forte)h+='<div class="box"><h2>6. Pontos fortes e pontos de atenção de '+esc(first)+'</h2><p class="foot">Síntese das seções 3 a 5, conforme a planilha.</p>'+T(['~Nº','~Tema','~Evidência','~Leitura'],R.forte.map(x=>'<tr><td>'+x.n+'</td><td><b>'+esc(x.tema)+'</b></td><td>'+esc(fill(x.ev)).replace(/\n/g,'<br>')+'</td><td>'+esc(fill(x.lei))+'</td></tr>'))+'</div>';
    h+='<div class="box"><h2>'+(R.forte?'7':'6')+'. Recomendações para potencializar a liderança de '+esc(first)+'</h2><p class="foot">Focos priorizados pelos dados das seções 3 a 5, conforme a planilha.</p>'+T(['~Nº','~Tema','~Evidência','~Ações recomendadas','~Como acompanhar / meta'],R.itens.map(x=>'<tr><td>'+x.n+'</td><td><b>'+esc(x.tema)+'</b></td><td>'+esc(fill(x.ev)).replace(/\n/g,'<br>')+'</td><td>'+esc(fill(x.ac))+'</td><td>'+esc(fill(x.meta))+'</td></tr>'))+'</div>';return h}
  const pr=I.P.filter(p=>p.diag==='Prioridade de desenvolvimento').sort((a,b)=>a.gap-b.gap).slice(0,6),fo=I.P.filter(p=>p.gap!=null&&p.gap>=10&&p.nps>=50).sort((a,b)=>b.gap-a.gap).slice(0,5);
  const li=p=>'<li>'+esc(p.q)+' <span class="foot">· NPS '+sg(p.nps,0)+' (pares '+sg(p.bench,0)+'; sem destoantes '+sg(p.sd,0)+')</span></li>';
  return '<div class="box"><h2>6. Pontos de atenção e pontos fortes</h2><p class="foot">Síntese automática das seções 3 a 5 (a planilha traz recomendações redigidas só para duas coordenadoras).</p><div class="two"><div><b>Prioridades de desenvolvimento</b>'+(pr.length?'<ul>'+pr.map(li).join('')+'</ul>':'<p class="foot">Nenhuma pergunta com NPS sem destoantes abaixo do benchmark em mais de '+D.params.prio+' pontos.</p>')+'</div><div><b>Pontos fortes (acima dos pares)</b>'+(fo.length?'<ul>'+fo.map(li).join('')+'</ul>':'<p class="foot">Nenhum destaque claro acima dos pares.</p>')+'</div></div></div>'}
function vInd(){const c=COORD[S.sel],I=D.ind[S.sel],P=I.P;const first=tc(c.nome).split(' ')[0];
  let h='<div class="fbar"><span class="lb">Avaliado</span>'+sel('sel',ACT.map(x=>[x.nome,tc(x.nome)+' · '+x.fun]),S.sel)+'</div>';
  h+='<div class="hero"><div><h2>Análise individual · '+esc(tc(c.nome))+'</h2><p>'+esc(c.fun)+' · '+esc(c.un.join(', '))+'. Base: respostas válidas (sem duplicadas e sem “Não Aplicável”). Benchmark = demais avaliados da função.</p></div><div class="hk"><div><b>'+sg(c.nps,1)+'</b><span>NPS</span></div><div><b>'+pc(c.fav)+'</b><span>favorável</span></div><div><b>'+nf(c.med,2)+'</b><span>média (1–5)</span></div><div><b>'+c.rank+'º/'+c.rankN+'</b><span>na função</span></div></div></div>';
  const sdd=I.nps_sd;
  h+='<div class="actbar"><span>Documentos de '+esc(first)+':</span><button class="act rel" data-doc="rel">📄 Relatório</button><button class="act fb" data-doc="fb">🗣️ Roteiro de feedback</button><button class="act pdi" data-doc="pdi">🎯 PDI-SMART</button></div>';
  h+='<div class="box"><h2>Radar · '+esc(first)+' × demais coordenadores</h2><div class="fbar"><label class="chk"><input type="checkbox" data-f="rOthers"'+(S.rOthers?' checked':'')+'> Mostrar os demais coordenadores da função</label></div><div class="radwrap">'+radarC(S.sel,S.rOthers)+'</div></div>';
  h+='<div class="two"><div class="box"><h2>1. Visão geral</h2>'+T(['~Indicador','~'+first,'~'+c.fun+' (todos)','Diferença'],[
    ['NPS',sg(c.nps,1),nf(I.peerNps,1),sg(c.nps-I.peerNps,1)],['% Favorável',pc(c.fav),pc(I.peerFav),sg((c.fav-I.peerFav)*100,1)+' p.p.'],['Média (1–5)',nf(c.med,2),nf(I.peerMed,2),sg(c.med-I.peerMed,2)],['Nº professores',c.np_,'',''],['Respostas válidas',c.n,'',''],['Ranking na função (NPS)',c.rank+'º de '+c.rankN,'',''],['NPS sem professores destoantes (seção 4)',sg(sdd,1),nf(I.peerNps,1),sg(sdd-I.peerNps,1)]
  ].map(r=>'<tr><td>'+r[0]+'</td><td class="n">'+r[1]+'</td><td class="n">'+r[2]+'</td><td class="n">'+r[3]+'</td></tr>'))+(c.alerta?'<p>'+alertChip(c.alerta)+'</p>':'')+'</div>';
  const tot=RESP.reduce((s,k)=>s+I.dist[k],0);
  h+='<div class="box"><h2>2. Distribuição das respostas</h2><div class="bars">'+RESP.map((k,i)=>{const v=I.dist[k],w=tot?v/tot*100:0;const col=['var(--ok)','#9cc4f5','var(--ad)','#f0a24d','var(--at)','var(--mut)'][i];return '<div class="brow"><div class="bl">'+k+'</div><div class="bt"><i style="width:'+w+'%;background:'+col+'"></i></div><div class="bv"><b>'+v+'</b><small>'+pc(v/tot)+'</small></div></div>'}).join('')+'</div><p class="foot">Total '+tot+' respostas (inclui “Não Aplicável”, que não entra nas métricas). NPS = % Sempre − % Às vezes/Raramente/Nunca.</p></div></div>';
  /* 3 */
  const rows=P.filter(p=>!S.onlyPrio||p.diag).map(p=>p),hs=scale3(P.map(p=>p.nps)),hg=scale3(P.map(p=>p.gap),0),hsd=scale3(P.map(p=>p.sd));
  let lastB='';
  h+='<div class="box"><h2>3. Avaliação por pergunta</h2><div class="fbar"><label class="chk"><input type="checkbox" data-f="onlyPrio"'+(S.onlyPrio?' checked':'')+'> Mostrar só perguntas com diagnóstico</label></div>'+TQ(['~Bloco','~Pergunta','Respostas válidas','NPS','% Favorável','Média (1–5)','Nº respostas negativas','NPS demais ('+c.fun+')','Gap vs. benchmark','NPS sem destoantes','~Diagnóstico'],rows.map(p=>{const b=p.bloco.replace(/^BLOCO \d+\s*[-–]\s*/i,'');const row='<tr><td>'+(p.bloco===lastB?'':'<b>'+esc(p.bloco.match(/^BLOCO \d+/i)?p.bloco.match(/^BLOCO \d+/i)[0]:'')+'</b><br><span class="foot">'+esc(b)+'</span>')+'</td><td>'+esc(p.q)+'</td><td class="n">'+p.n+'</td><td class="n" style="'+hs(p.nps)+'">'+nf(p.nps,1)+'</td><td class="n">'+pc(p.fav)+'</td><td class="n">'+nf(p.med,2)+'</td><td class="n">'+p.neg+'</td><td class="n">'+(p.bench==null?'—':nf(p.bench,1))+'</td><td class="n" style="'+hg(p.gap)+'">'+(p.gap==null?'—':sg(p.gap,1))+'</td><td class="n" style="'+hsd(p.sd)+'">'+(p.sd==null?'—':nf(p.sd,1))+'</td><td>'+(p.diag?'<span class="chip '+(p.diag.startsWith('Prior')?'at':'ad')+'">'+esc(p.diag)+'</span>':'')+'</td></tr>';lastB=p.bloco;return row}))+'<p class="foot">Diagnóstico: “Prioridade de desenvolvimento” = NPS sem destoantes abaixo do benchmark em mais de '+D.params.prio+' pontos; “Abaixo, mas puxado por destoantes” = NPS geral abaixo do benchmark em mais de '+D.params.prio+' pontos, mas o NPS sem destoantes não.</p></div>';
  /* 4 */
  h+='<div class="box"><h2>4. Professores destoantes (resumo)</h2><p class="foot">Professor destoante = média de notas dada ao avaliado abaixo de (média das médias − '+D.params.ncrit+' desvio-padrão). Por confidencialidade, os professores não são listados nem identificados: apenas o resumo.</p><div class="stat"><div><b>'+nf(I.mu,2)+'</b><span>média das médias dos professores</span></div><div><b>'+nf(I.sd,2)+'</b><span>desvio-padrão das médias</span></div><div><b>'+nf(I.lim,2)+'</b><span>limite para destoante</span></div><div><b>'+I.ndest+' de '+I.npro+'</b><span>professores destoantes</span></div><div><b>'+Math.round(I.shareneg*100)+'%</b><span>das respostas negativas vêm deles</span></div><div><b>'+sg(sdd,1)+'</b><span>NPS sem os destoantes</span></div></div><div class="note">Este recorte é uma análise de sensibilidade: o NPS oficial do avaliado (acima) considera todos os professores.</div></div>';
  /* 5 */
  h+='<div class="box"><h2>5. Os professores destoantes também avaliam mal outros gestores?</h2><p class="foot">Compara o NPS que cada professor destoante deu ao avaliado com o que deu aos demais avaliados (critério: crítico em geral = NPS médio aos demais abaixo de '+D.params.cger+'; crítico específico = NPS ao avaliado mais de '+D.params.cesp+' pontos abaixo do dado aos demais).</p><div class="stat"><div><b>'+I.G+'</b><span>críticos em geral (avaliam mal outros gestores)</span></div><div><b>'+I.E+'</b><span>críticos específicos ao avaliado</span></div><div><b>'+I.S+'</b><span>sem padrão claro</span></div></div></div>';

  b2+='<h3>Avaliação por pergunta</h3><div class="wrap"><table class="rtab"><thead><tr><th>Bloco</th><th>Pergunta</th><th class="n">Resp.</th><th class="n">NPS</th><th class="n">% Fav.</th><th class="n">Média</th><th class="n">Neg.</th><th class="n">Pares</th><th class="n">Gap</th><th>Diagnóstico</th></tr></thead><tbody>'+P.map(p=>{const bn=(String(p.bloco).match(/^BLOCO \d+/i)||[''])[0];const r='<tr><td>'+(p.bloco===lastB?'':'<b>'+esc(bn)+'</b>')+'</td><td>'+esc(p.q)+'</td><td class="n">'+p.n+'</td><td class="n" style="'+hs(p.nps)+'">'+nf(p.nps,1)+'</td><td class="n">'+pc(p.fav)+'</td><td class="n">'+nf(p.med,2)+'</td><td class="n">'+p.neg+'</td><td class="n">'+(p.bench==null?'—':nf(p.bench,1))+'</td><td class="n" style="'+hg(p.gap)+'">'+(p.gap==null?'—':sg(p.gap,1))+'</td><td>'+(p.diag?'<span class="chip '+(p.diag.startsWith('Prior')?'at':'ad')+'">'+esc(p.diag)+'</span>':'')+'</td></tr>';lastB=p.bloco;return r}).join('')+'</tbody></table></div><p class="foot">Pares = NPS dos demais avaliados da função. Gap = NPS − pares. “Prioridade de desenvolvimento” = NPS sem destoantes abaixo do benchmark em mais de '+D.params.prio+' pontos; “Abaixo, mas puxado por destoantes” = NPS geral abaixo do benchmark, mas não o NPS sem destoantes.</p>';

  h+=SEC('O que melhorar — prioridades de desenvolvimento',d);
  return '<div class="rel">'+h+'</div>'}
function docFB(nome){const x=ctxC(nome),{c,I,B,fortes,fracos,qFortes}=x,nm=tc(c.nome).split(' ')[0];

function docPDI(nome){const x=ctxC(nome),{c,I,B}=x,ms=metasC(x),ini=0;

function setPrintTheme(on){const r=document.documentElement;if(on){if(window.__pt===undefined)window.__pt=r.getAttribute('data-theme');r.setAttribute('data-theme','light')}else if(window.__pt!==undefined){if(window.__pt===null)r.removeAttribute('data-theme');else r.setAttribute('data-theme',window.__pt);window.__pt=undefined}}
window.addEventListener('beforeprint',()=>{if(document.body.classList.contains('print-modal'))setPrintTheme(true)});
window.addEventListener('afterprint',()=>{setPrintTheme(false)});
const DOCS={rel:['Relatório',docRel],fb:['Roteiro de feedback',docFB],pdi:['PDI-SMART',docPDI]};
function docStandalone(k,nome,auto){
  const body=document.getElementById('doc-'+k).cloneNode(true);body.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));body.querySelectorAll('.noprint').forEach(e=>e.remove());
  body.querySelectorAll('select').forEach(sl=>{const t=document.createElement('span');t.textContent=sl.value;sl.replaceWith(t)});
  const st=[...document.querySelectorAll('style')].map(x=>x.textContent).join('\n');
  return '<!doctype html><html lang="pt-BR" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+DOCS[k][0]+' · '+esc(tc(nome))+'</title><style>'+st+'\nbody::before,body::after{display:none!important}body{background:#fff!important;color:#14213a!important;padding:16px}.mc{max-width:900px;margin:0 auto}.ed{outline:none!important}.box,.meta,.card{box-shadow:none!important;background:#fff!important}'+A4CSS.replace(/%P%/g,'.mc')+'@media print{body{padding:0!important}.mc{max-width:none!important}}.wrap{overflow:visible!important}table{font-size:10px!important;width:100%;table-layout:auto}th{font-size:9px!important;line-height:1.2}th,td{padding:3px 4px!important;overflow-wrap:anywhere;white-space:normal!important}tr{break-inside:avoid}.wrap .chip{white-space:normal}</style></head><body><div class="mc acao-doc">'+body.innerHTML+'</div>'+(auto?'<script>window.onload=function(){setTimeout(function(){window.print()},500)}<\/script>':'')+'</body></html>'}
function printDoc(k,nome){
  let w=null;try{w=window.open('','_blank')}catch(e){}
  if(w&&w.document){w.document.open();w.document.write(docStandalone(k,nome,true));w.document.close();return}
  const m=document.getElementById('modal');m.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));document.body.classList.add('print-modal');
  try{window.print()}catch(e){alert('Não foi possível imprimir aqui. Use "Salvar arquivo" e abra no navegador.')}}
function saveDoc(k,nome){const bl=new Blob([docStandalone(k,nome,false)],{type:'text/html'}),u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download=DOCS[k][0].replace(/\s+/g,'_')+'_'+tc(nome).replace(/\s+/g,'_')+'.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},500)}
function openDoc(k,nome){const m=document.getElementById('modal');
  m.innerHTML='<div class="mb"><div class="mt noprint"><h2>'+DOCS[k][0]+' · '+esc(tc(nome))+'</h2><span class="sp" style="flex:1"></span><button id="mp">🖨 Imprimir / PDF</button><button id="ms">⬇ Salvar arquivo</button><button id="mx">Fechar</button></div><div class="mc acao-doc" id="doc-'+k+'">'+DOCS[k][1](nome)+'</div></div>';
  if(k==='rel')m.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
  m.classList.add('open');document.getElementById('mx').onclick=closeDoc;
  document.getElementById('mp').onclick=()=>printDoc(k,nome);document.getElementById('ms').onclick=()=>saveDoc(k,nome);
  window.onafterprint=()=>document.body.classList.remove('print-modal');m.scrollTop=0}
function closeDoc(){const m=document.getElementById('modal');m.classList.remove('open');m.innerHTML='';document.body.classList.remove('print-modal')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDoc()});
/* ---- aba Radar ---- */
function vRad(){const L=ACT.filter(c=>c.fun===S.rfun),met=S.rmet==='nps';
  const blocs=[...new Set(D.bl.filter(b=>b.fun===S.rfun).map(b=>b.bloco))].sort((a,b)=>bnum(a)-bnum(b));
  const axes=blocs.map(b=>({l:bshort(b),c:BCOL[(bnum(b)-1+9)%9]}));
  const val=(nome,b)=>{const r=D.bl.find(x=>x.nome===nome&&x.bloco===b);return r?(met?r.nps:r.med):null};
  const fv=blocs.map(b=>{const f=D.bl.filter(x=>x.fun===S.rfun&&x.bloco===b),n=f.reduce((s,x)=>s+x.n,0);return f.reduce((s,x)=>s+(met?x.nps:x.med)*x.n,0)/n});
  const ser=L.map((c,i)=>({name:nomeCurto(c.nome),c:PAL[i%8],w:2.2,fill:L.length<=2,dots:true,v:blocs.map(b=>val(c.nome,b)),z:2}));
  ser.push({name:'Média da função',c:'#667085',w:2.6,dash:'6 4',v:fv,z:3});
  let h='<h2 class="ph">Radar comparativo por bloco</h2><div class="fbar"><span class="lb">Função</span>'+segb('rfun',FUNS.map(f=>[f,f.replace('Coord. ','')]),S.rfun)+'<span class="lb">Medida</span>'+segb('rmet',[['med','Média (1–5)'],['nps','NPS']],S.rmet)+'</div>';
  h+='<div class="box"><div class="radwrap">'+(axes.length>=3?radarSVG(axes,ser,met?{min:-40,max:100,ticks:[0,25,50,75,100],f:v=>nf(v,0)}:{min:3,max:5,ticks:[3.5,4,4.5,5],f:v=>nf(v,1)})+legend(ser):'<p class="foot">Poucos blocos para o radar.</p>')+'</div><p class="foot" style="text-align:center">'+(met?'NPS por bloco. Centro = −40 · borda = +100.':'Média (1–5) por bloco. Centro = 3,0 · borda = 5,0.')+' Clique em um coordenador na aba Ranking para ver o radar individual.</p></div>';
  const rows=L.map((c,i)=>{return '<tr><td><i class="dot" style="background:'+PAL[i%8]+'"></i><b>'+esc(tc(c.nome))+'</b></td>'+blocs.map(b=>{const v=val(c.nome,b);return '<td class="n">'+(v==null?'—':met?nf(v,0):nf(v,2))+'</td>'}).join('')+'</tr>'});
  rows.push('<tr><td><b>Média da função</b></td>'+fv.map(v=>'<td class="n"><b>'+(met?nf(v,0):nf(v,2))+'</b></td>').join('')+'</tr>');
  h+=T(['~Coordenador'].concat(blocs.map(b=>'B'+bnum(b))),rows);
  return h+'<div class="note">'+blocs.map(b=>'<b>B'+bnum(b)+'</b> '+esc(bshort(b).replace(/^B\d+ · /,''))).join(' · ')+'</div>'}
