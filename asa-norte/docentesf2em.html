.dots i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:3px;background:var(--line)}
.dots .ok i{background:var(--ok)}.dots .ad i{background:var(--gold)}.dots .at i{background:var(--at)}
.phead{position:sticky;top:0;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh);margin-bottom:12px}
.phead h2{margin:0;font-size:19px}.phead .meta2{color:var(--mut);font-size:12.5px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:0}
.tabs button{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;background:var(--card);color:var(--ink)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
:root[data-theme=dark] .tabs button.on{color:#12161d}
.box{border-radius:16px;box-shadow:var(--sh)}
.box h2{font-size:16px;display:flex;align-items:center;gap:8px}
.kpi2>div{border-radius:16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi2 .v{display:flex;align-items:center;gap:12px}
.gauge{display:flex;align-items:center;gap:14px}
.dimrow{display:grid;grid-template-columns:190px 1fr;gap:10px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dimrow:first-child{border-top:0}
.dimrow .dn{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13.5px}.dimrow .dn small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.dimrow .dn .bub{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none}
.bl .t{height:10px}
.radwrap{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:18px;align-items:center}
@media(max-width:820px){.radwrap{grid-template-columns:1fr}.dimrow{grid-template-columns:1fr}}
.heat td.hc{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.hc.at{background:var(--atb)}.hc.ad{background:var(--adb)}.hc.ok{background:var(--okb)}
.insight{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;margin:6px 0;font-size:13px}
.insight.ok{background:var(--okb)}.insight.at{background:var(--adb)}.insight.dv{background:color-mix(in srgb,var(--c3) 9%,var(--card))}
.insight .ii{font-size:17px;line-height:1.2}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.cols2{grid-template-columns:1fr}}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:8px}
.srcgrid div{border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px}
.srcgrid b{display:block;font-size:12.5px}.srcgrid .pill{margin-top:4px}
.vcomp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.vcomp div{border-radius:12px;background:color-mix(in srgb,var(--c3) 9%,var(--card));padding:8px 10px;font-size:12px}.vcomp b{display:block;font-size:17px}
.foot a,.footlink{color:var(--acc);cursor:pointer;text-decoration:underline}
.sctr,.radsvg{max-width:100%}
.print-hide{}
@media print{header{display:none}.phead{position:static;box-shadow:none}}
.pcard h3{color:var(--ink)}.pc-top h3 span{color:inherit}
.c-f i{background:var(--d2)}.lg .cf:before{background:var(--d2)}
.bl .rd{font-size:11.5px;color:var(--mut);margin-top:3px}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
.duo>div{background:color-mix(in srgb,var(--c1,#2a5da8) 7%,transparent);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column}
.duo span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.duo b{font-size:19px;line-height:1.2}.duo b.ok{color:var(--ok)}.duo b.ad{color:var(--ad)}.duo b.at{color:var(--at)}.duo b.na{color:var(--mut)}
.calcbtn{margin-top:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:12.5px}
.calcbtn:hover{border-color:var(--c1,#2a5da8);color:var(--c1,#2a5da8)}
.mc.calc h3{margin:14px 0 4px}.mc.calc .box{margin-top:12px}
@media print{.calcbtn{display:none}}
.duo b{background:none!important;padding:0!important}
.duo b{background:none!important;padding:0!important}

@keyframes wmfloat{to{transform:translateY(-52%) rotate(1.5deg)}}
header{background:rgba(2,36,66,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header img.brasao{height:36px;width:auto;background:#f4ebd4;padding:5px 7px;border-radius:10px}
h1,h2,.hero h2{font-family:Manrope,Inter,sans-serif;letter-spacing:-.01em}
#th{display:none}
.tag{background:rgba(244,235,212,.14);color:#f4ebd4}.tag.at{background:rgba(168,70,90,.35);color:#ffd9d2}
nav.main{background:rgba(2,36,66,.78);backdrop-filter:blur(10px)}
button,.btn{background:rgba(244,235,212,.06)}
button.on,.seg button.on,.tabs button.on{background:#f4ebd4;color:#551c25;border-color:#f4ebd4}
.seg button.on{color:#551c25}
.seg{background:rgba(244,235,212,.06)}
.box,.pcard,.pc,.kpis div{background:rgba(10,47,82,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-color:var(--line)}
.hero{background:linear-gradient(120deg,rgba(85,28,37,.92) 0%,rgba(2,36,66,.92) 70%,rgba(19,52,43,.9) 130%);border:1px solid rgba(244,235,212,.2)}
.hero p,.hero .hk span{color:#e8e0c8}
.hero .hk div{background:rgba(244,235,212,.1);border-color:rgba(244,235,212,.25)}
.avt{background:#551c25;color:#f4ebd4}
input,select{background:rgba(244,235,212,.08);color:var(--ink);border:1px solid var(--line)}
select option{background:#0a2f52;color:#f4ebd4}
/* nota do Índice Final pulsando */
svg[role=img][aria-label^="Nota"]{overflow:visible;transform-origin:center;animation:notaPulse 2.6s ease-in-out infinite;filter:drop-shadow(0 0 0 rgba(244,235,212,0))}
.pcard:nth-child(3n+2) svg[role=img]{animation-delay:-.9s}.pcard:nth-child(3n) svg[role=img]{animation-delay:-1.7s}
@keyframes notaPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(244,235,212,0))}45%{transform:scale(1.09);filter:drop-shadow(0 0 9px rgba(244,235,212,.45))}60%{transform:scale(.99)}}
.pcard svg[role=img]:hover{animation-duration:.8s}
}

/* ===== tema claro (padrão) — identidade Heavenly em versão clara ===== */
@media screen{
:root[data-theme=light]{color-scheme:light;--bg:#eef4fb;--card:#fff;--ink:#14213a;--mut:#5a6578;--line:#d6e0ee;--acc:#022442;--ok:#13804a;--ad:#9a6a06;--at:#c0261b;--okb:#dff4e8;--adb:#fdf1cc;--atb:#fde3df;--c1:#2f6db5;--c2:#d9731a;--c3:#7a4fb0;--sh:0 10px 30px rgba(2,36,66,.12)}
:root[data-theme=light] body{background:#eef4fb}
:root[data-theme=light] body::before{background:radial-gradient(40vmax 40vmax at 8% -8%,rgba(85,28,37,.13),transparent 70%),radial-gradient(34vmax 34vmax at 100% 30%,rgba(19,128,90,.13),transparent 70%),radial-gradient(30vmax 30vmax at 40% 110%,rgba(47,109,181,.14),transparent 70%),linear-gradient(135deg,#f8fbff 0%,#e9f1fb 60%,#e2edfa 100%)}
:root[data-theme=light] body::after{filter:invert(1) sepia(1) hue-rotate(185deg) saturate(2.5);opacity:.08}
:root[data-theme=light] header,:root[data-theme=light] nav.main{background:rgba(255,255,255,.88)}
:root[data-theme=light] header h1,:root[data-theme=light] header small,:root[data-theme=light] header .btn,:root[data-theme=light] header button{color:#14213a}
:root[data-theme=light] header small{color:#5a6578}
:root[data-theme=light] .tag{background:var(--adb);color:var(--ad)}
:root[data-theme=light] .tag.at{background:var(--atb);color:var(--at)}
:root[data-theme=light] button,:root[data-theme=light] .btn{background:var(--card)}
:root[data-theme=light] button.on,:root[data-theme=light] .seg button.on,:root[data-theme=light] .tabs button.on{background:#551c25;color:#f4ebd4;border-color:#551c25}
:root[data-theme=light] .seg{background:rgba(2,36,66,.05)}
:root[data-theme=light] .box,:root[data-theme=light] .pcard,:root[data-theme=light] .pc,:root[data-theme=light] .kpis div{background:rgba(255,255,255,.92)}
:root[data-theme=light] .hero{color:#f4ebd4}:root[data-theme=light] .hero h2,:root[data-theme=light] .hero b{color:#fff}
:root[data-theme=light] input,:root[data-theme=light] select{background:#fff;color:var(--ink);border:1px solid var(--line)}
:root[data-theme=light] select option{background:#fff;color:#14213a}
}
@media screen{#th{display:inline-block}}
@media screen and (prefers-reduced-motion:reduce){body::after{animation:none}svg[role=img][aria-label^="Nota"]{animation:none}}
@media print{body::before,body::after{display:none}svg[role=img]{animation:none!important;filter:none!important}}
</style>
<style id="rel-a4">
.rel .sech{display:flex;align-items:center;gap:10px;font-size:17px;margin:16px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--c1)}
.rel .sech span{width:26px;height:26px;border-radius:50%;background:var(--c1);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.rel .kps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.rel .kp{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}.rel .kp span{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}.rel .kp b{display:block;font-size:24px;line-height:1.2}.rel .kp small{display:block;color:var(--mut);font-size:11px}

function radarEixos(rows){
  const ds=rows.filter(r=>num(r.C)||num(r.A));if(ds.length<3)return '';
  const W=400,H=330,cx=W/2,cy=H/2+4,R=108,n=ds.length,MIN=40;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n,r=R*Math.max(0,Math.min(100,v)-MIN)/(100-MIN);return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};

  [40,55,70,85,100].forEach(v=>{s+='<polygon points="'+ds.map((_,i)=>pt(i,v).join(',')).join(' ')+'" fill="none" stroke="var(--line)" stroke-width="1"/>'});
  ds.forEach((r,i)=>{const [px,py]=pt(i,100),[lx,ly]=pt(i,120);const lab=r.nome.split(' e ')[0].split(',')[0];s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+px+'" y2="'+py+'" stroke="var(--line)"/><text x="'+lx+'" y="'+(ly+5)+'" text-anchor="'+(lx<cx-8?'end':lx>cx+8?'start':'middle')+'" font-size="12" fill="var(--ink)">'+EXI[r.k][0]+' '+esc(lab.length>16?lab.slice(0,15)+'…':lab)+'</text>'});
  const poly=(key,col,dash,fill)=>{const pts=ds.map((r,i)=>pt(i,num(r[key])?r[key]:MIN).join(',')).join(' ');return '<polygon points="'+pts+'" fill="'+(fill?col:'none')+'" fill-opacity=".14" stroke="'+col+'" stroke-width="2.2"'+(dash?' stroke-dasharray="5 4"':'')+'/>'};
  s+=poly('gC','var(--mut)',true,false)+poly('C','var(--c1)',false,true)+poly('A','var(--c2)',false,true);
  ds.forEach((r,i)=>{[['C','var(--c1)'],['A','var(--c2)']].forEach(([k,col])=>{if(num(r[k])){const [px,py]=pt(i,r[k]);s+='<circle cx="'+px+'" cy="'+py+'" r="4.5" fill="'+col+'" stroke="var(--card)" stroke-width="2"><title>'+esc(r.nome)+' · '+(k==='C'?'coordenação':'autoavaliação')+': '+fmt(r[k])+'</title></circle>'}})});
  return s+'</svg><div class="lg" style="justify-content:center"><span class="c1">Coordenação (bruta)</span><span class="c2">Autoavaliação</span><span><i style="display:inline-block;width:14px;border-top:2px dashed var(--mut);vertical-align:3px;margin-right:4px"></i>Média da coordenação no segmento</span></div><p class="foot" style="text-align:center">Centro = 40 · borda = 100.</p>';
}

  h+='<div class="cols2"><div class="insight ok"><span class="ii">⭐</span><div><b>Onde você mais confia na sua prática</b><ul>'+hi.map(li).join('')+'</ul></div></div><div class="insight at"><span class="ii">🔎</span><div><b>Onde você se vê com mais espaço para crescer</b><ul>'+lo.map(li).join('')+'</ul></div></div></div>';

  h+='<div class="note"><b>Para refletir:</b><ul><li>Que evidências (produções de alunos, registros, devolutivas) sustentam a sua nota mais alta e a mais baixa?</li><li>Em quais dimensões a sua visão difere da coordenação e o que a coordenação pode estar observando que você não vê — ou o contrário?</li><li>Qual dos itens de menor autoavaliação você gostaria de transformar em uma meta do seu PDI?</li></ul></div>';

}
function docFB(c){

  if(p.tutor){const lt=p.tut.q.filter(q=>q.n>=5&&num(q.m)).slice().sort((a,b)=>a.m-b.m)[0];
    h+='<h3>7. Tutoria e famílias — o que mencionar</h3><ul><li>Coordenação (ajustada): <b>'+fmt(p.dims.TUTORIA.Cadj)+'</b> · Autoavaliação: <b>'+fmt(p.dims.TUTORIA.A)+'</b> · Alunos: <b>'+fmt(p.tut.m)+'</b> ('+p.tut.resp+' alunos) · Famílias: <b>'+fmt(p.fam.m)+'</b> ('+p.fam.n+' resp.).</li>'+(lt?'<li>Pergunta de menor nota entre os alunos: “'+esc(lt.t)+'” — <b>'+fmt(lt.m)+'</b>'+(num(GT[p.seg][lt.q])?' (segmento '+fmt(GT[p.seg][lt.q])+')':'')+'.</li>':'')+(p.tut.resp<5||p.fam.n<3?'<li class="foot">Cobertura limitada de respostas: ler com cautela.</li>':'')+'</ul><div class="foot">Perguntas de escuta (escolha 1–2):</div><ul>'+libFor('TUTORIA').esc.map(q=>'<li>'+ed(esc(q))+'</li>').join('')+'</ul>'+edb('[Observações sobre tutoria e comunicação com famílias]');}

function perguntasRel(c){
  const head='<div class="ql h"><div>Pergunta · dimensão</div><div class="n">n</div><div class="n">Você</div><div class="n">Seg.</div></div>';
  const row=q=>'<div class="ql"><div>'+esc(shortQ(q.t))+' <span class="foot">· '+esc(DN[q.d]||q.d)+'</span></div><div class="n">'+q.n+'</div><div class="n">'+sc(q.m)+'</div><div class="n">'+fmt(q.g)+'</div></div>';
  const L=c.qc.filter(q=>q.n>=2&&num(q.m));
  const baixas=L.slice().sort((a,b)=>a.m-b.m).filter(q=>q.m<85||(num(q.g)&&q.m<q.g-4)).slice(0,10);
  const altas=L.slice().sort((a,b)=>b.m-a.m).filter(q=>q.m>=90).slice(0,5);
  let h='<h3>Perguntas em que a coordenação viu mais espaço para crescer</h3>'+(baixas.length?head+baixas.map(row).join(''):'<p class="foot">Nenhuma pergunta ficou abaixo de 85 ou claramente abaixo da média do segmento.</p>');
  h+='<h3>Perguntas com as melhores avaliações</h3>'+(altas.length?head+altas.map(row).join(''):'<p class="foot">Nenhuma pergunta com média ≥ 90 e ao menos 2 respostas.</p>');
  return h+'<p class="foot">“Seg.” = média do segmento (professores ativos). Só aparecem perguntas com ao menos 2 respostas da coordenação. A lista completa fica com a coordenação.</p>';
}
function docRel(c){
  const p=c.p,g=c.g,i=p.idp,cd=p.coord;let n=0;
  const SEC=(t,body,cls)=>'<section class="sec'+(cls?' '+cls:'')+'"><h2 class="sech"><span>'+(++n)+'</span>'+t+'</h2>'+body+'</section>';
  const K=(l,v,s)=>'<div class="kp"><span>'+l+'</span><b>'+v+'</b><small>'+s+'</small></div>';
  let h=cab('Relatório do Professor — Avaliação docente',c);
  h+='<div class="note">Reúne o que <b>coordenação, estudantes, famílias</b> e a <b>sua autoavaliação</b> disseram sobre a sua atuação: <b>Resumo</b>, <b>Dimensões e fontes</b>, <b>Voz dos alunos</b>, <b>Tutoria e famílias</b> e as <b>prioridades de melhoria</b>. Os números (escala de 0 a 100) são percepções de grupos de respondentes: servem para reflexão e para o seu PDI, não como julgamento definitivo.</div>';
  // 1 · RESUMO
  let a='<div class="kps">'+K(idpLab(p),(idpVal(p)==null?'—':sc(idpVal(p))),i.tipo==='completo'?'média do segmento '+fmt(g.final):i.tipo==='parcial'?'só coordenação; não comparável ao completo':esc(i.motivo||''))
    +K('Coordenação (ajustada)',sc(notaCoord(p)),'bruta '+fmt(cd.Cb)+' · '+cd.n+' respostas · '+cd.nAval+' avaliadora(s)')
    +K('Famílias e alunos',sc(notaFam(p)),esc(vozTxt(p)))
    +K('Autoavaliação',sc(p.auto.A),c.gap==null?'sem comparação':'diferença para a coordenação: '+(c.gap>0?'+':'')+fmt(c.gap)+' pts · média '+fmt(g.A))+'</div>';
  if(i.tipo==='completo')a+='<p class="foot">Como foi calculado: Base = 50% coordenação ajustada + 50% famílias e alunos; perda 1 (coordenação × voz externa): '+fmt(i.perda1)+'; perda 2 (autoavaliação × Base): '+fmt(i.perda2)+'. As perdas só descontam, nunca somam. Semáforo: vermelho &lt; 85 · amarelo 85–89,9 · verde ≥ 90.</p>';
  else a+='<p class="foot">'+esc(i.motivo||'Sem Índice Final completo.')+' Semáforo: vermelho &lt; 85 · amarelo 85–89,9 · verde ≥ 90.</p>';
  a+='<h3>Fontes e critérios <span class="foot">(detalhes e ações de melhoria nas partes seguintes)</span></h3>'+elegCheck(c);
  a+='<h3>Resultado por dimensão</h3>'+tabela(c);
  a+='<div class="radwrap"><div>'+radar(c)+'</div><div><div class="box"><h3>Pontos fortes</h3>'+(c.fortes.length?'<ul>'+c.fortes.slice(0,3).map(f=>'<li>'+esc(f.t)+'</li>').join('')+'</ul>':'<p class="foot">Sem destaque claro acima de 90 ou do segmento.</p>')+'</div><div class="box"><h3>Oportunidades de desenvolvimento</h3>'+(c.opps.length?'<ul>'+c.opps.slice(0,4).map(o=>'<li><b>'+esc(dimNome(o.dim==='VOZ'?'Voz dos estudantes':o.dim))+'</b> — '+esc(o.ev[0]||'')+'</li>').join('')+'</ul>':'<p class="foot">Nenhuma dimensão abaixo de 85 ou muito abaixo do segmento.</p>')+'</div></div></div>';
  h+=SEC('Resumo',a);
  // 2 · DIMENSÕES E FONTES
  let b='<div class="stat"><div><b>'+fmt(cd.Cb)+'</b><span>nota bruta da coordenação ('+cd.n+' respostas)</span></div><div><b>'+(cd.vies>0?'+':'')+fmt(cd.vies)+'</b><span>rigor médio das avaliadoras (viés)</span></div><div><b>'+fmt(cd.Cadj)+'</b><span>coordenação ajustada = bruta − viés</span></div><div><b>'+cd.nAval+'</b><span>avaliadoras (não identificadas neste documento)</span></div></div>';
  b+='<h3>Suas quatro visões por dimensão</h3>'+dimBars(c);
  b+='<h3>Sua autoavaliação em perspectiva</h3>'+autoBlock(c);
  b+='<h3>Triangulação por eixo comum</h3>'+eixoTable(c);
  if(c.diverg.length)b+='<h3>Onde as fontes se afastam</h3><ul class="dvl">'+c.diverg.slice(0,5).map(d=>'<li>'+esc(d.t)+'</li>').join('')+'</ul><p class="foot">Diferenças entre fontes não são falhas: indicam pontos para conversar e entender melhor'+(c.diverg.length>5?' (há '+(c.diverg.length-5)+' ponto(s) a mais, tratados no Roteiro de feedback)':'')+'.</p>';
  b+=perguntasRel(c);
  h+=SEC('Dimensões e fontes',b);
  // 3 · VOZ DOS ALUNOS
  h+=SEC('Voz dos alunos',tAlunos(c,true)+'<p class="foot">Os comentários dos estudantes são confidenciais e apresentados apenas em síntese, para proteger quem os escreveu. Eles não entram no cálculo do índice.</p>');
  // 4 · TUTORIA E FAMÍLIAS
  h+=SEC('Tutoria e famílias',tTutoria(c,true),p.tutor?'':'nobrk');
  // 5 · PRIORIDADES DE MELHORIA
  const ini0=iso(TODAY),sv=sintCom(p);
  const os=c.opps.filter(o=>DN[o.dim]||o.dim==='AUTOPERCEPÇÃO').slice(0,4);
  let m='<p>Esta parte junta, em um só lugar, <b>o que os resultados indicam como prioridade de melhoria</b>, com evidências e ações práticas. Escolha com a coordenação até 2 ou 3 prioridades para o seu PDI.</p>';
  if(os.length){
    m+=os.map((o,k)=>{const L=libFor(o.dim,o.tema),x=c.dims.find(d=>d.k===o.dim),d=dimNome(o.dim);
      const meta=(x&&x.nota!=null)?'nota atual <b>'+fmt(x.nota)+'</b>'+(num(x.g)?' · média do segmento '+fmt(x.g):'')+' · meta sugerida <b>'+fmt(alvo(x.nota,x.g))+'</b> até '+addDays(ini0,90):'';
      return '<div class="prio"><div class="ph"><span class="badge">Prioridade '+(k+1)+'</span><b>'+(DI[o.dim]?dic(o.dim)+' ':'')+esc(d)+'</b></div>'+(meta?'<div class="foot">'+meta+'</div>':'')
       +'<div class="pc"><div><b>O que os resultados mostram</b><ul>'+o.ev.slice(0,4).map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul></div><div><b>O que fazer nas próximas semanas</b><ul>'+L.ac.slice(0,3).map(z=>'<li>'+esc(z[0])+' <span class="foot">· '+esc(z[1])+'</span></li>').join('')+'</ul></div></div>'
       +'<div class="foot"><b>Como saberemos que melhorou:</b> '+esc(L.ind)+'.</div><div class="foot"><b>Para refletir:</b> '+L.esc.slice(0,2).map(esc).join(' · ')+'</div></div>'}).join('');
  }else m+='<div class="note">Nenhuma dimensão ficou abaixo de 85 ou muito abaixo do segmento. Sugestão: escolher uma prática que já funciona e compartilhá-la com a equipe, e definir um aprofundamento do seu interesse.</div>';
  if(sv.att.length)m+='<p><b>Temas que os estudantes sugerem olhar com atenção</b> (percepção dos estudantes, a verificar com as demais fontes): '+sv.att.map(x=>esc(x.d.nome.toLowerCase())+' <span class="foot">('+x.k+')</span>').join('; ')+'.</p>';

  const fo=c.fortes.slice(0,3);

function vMet(){
  const sum=f=>PR.reduce((a,p)=>a+f(p),0);
  const qc=new Set(),qa=new Set();PR.forEach(p=>{p.qc.forEach(x=>qc.add(x[0]));p.qa.forEach(x=>qa.add(x[0]))});
  const cnt=(set,d)=>[...set].filter(q=>QS[q].d===d).length;
  const T=PR.length,A=PR.filter(ativo).length;const OWN=!!D.FILE;
  const by=t=>PR.filter(p=>p.idp.tipo===t).length;
  let h='<div class="bar"><button data-act="back">← Voltar aos professores</button></div><div class="note"><b>Síntese metodológica para homologação.</b> Esta página responde ao item 21.11: o que foi preservado, o que foi adaptado, as regras usadas, o que depende de decisão institucional e as limitações. Tudo o que não foi homologado está marcado como <i>provisório</i>.</div>';
  h+='<div class="box"><h2>1. O que foi preservado do Kinder e do Fundamental I</h2><ul><li><b>Escala 0–100</b> (Sempre 100 · Quase sempre/Frequentemente 75 · Às vezes 50 · Raramente 25 · Nunca 0); “Não sei avaliar/Sem base” fora da média; resposta ausente nunca vira zero. Idioma (0–4) convertido para 0–100.</li><li><b>Viés da coordenação</b> por avaliadora (média dela − média geral) e <b>coordenação ajustada</b> = bruta − viés, com nota bruta, viés e ajustada sempre visíveis.</li><li><b>Fórmula do Índice Final</b>: Base = 50% coordenação ajustada + 50% voz externa; Perda 1 = 0,5 × (|coord. ajustada − voz externa| − 10, mínimo 0); Perda 2 = 0,5 × (|autoavaliação − Base| − 10, mínimo 0); Índice = Base − perdas. A autoavaliação <b>não soma pontos</b>: só pode reduzir o índice quando destoa da Base.</li><li><b>Elegibilidade</b>: ≥ 2 avaliadoras, autoavaliação presente e ≥ 5 respondentes externos; professores desligados/afastados saem do quadro, mas suas notas seguem nas médias do segmento.</li><li><b>Semáforo</b> (vermelho &lt; 85, amarelo 85–89,9, verde ≥ 90), identidade visual, roteiro de feedback, relatório do professor e PDI SMART (estrutura S-M-A-R-T, metas com ações, frequência, evidência, apoio e prazos de 30/60/90 dias).</li></ul></div>';
  h+='<div class="box"><h2>2. Adaptações necessárias ao Fund. II e Ensino Médio</h2><ul><li><b>Dimensões = blocos oficiais dos questionários</b>: Prática Pedagógica ('+cnt(qc,'PRÁTICA PEDAGÓGICA')+' perguntas da coordenação), Formação Integral ('+cnt(qc,'FORMAÇÃO INTEGRAL')+'), Psicologia / Socioemocional ('+cnt(qc,'PSICOLOGIA / SOCIOEMOCIONAL')+'); somadas a Tutoria ('+cnt(qc,'TUTORIA')+') e Idioma ('+cnt(qc,'IDIOMA')+'), que são blocos próprios dos instrumentos de alunos/famílias e itens da coordenação identificados por texto (“Como tutor(a)…” e “exclusivamente o idioma…”).</li><li><b>Dupla vinculação</b>: as perguntas de tutoria e de idioma pertencem ao bloco de origem na coordenação (Formação Integral/Prática Pedagógica) <i>e</i> à dimensão Tutoria/Idioma. Regra anti dupla contagem: cada pergunta entra uma única vez no cálculo, na dimensão mais específica (Tutoria/Idioma); o bloco de origem é calculado sem elas. O Índice Final usa todas as respostas da coordenação uma vez só.</li><li><b>Voz externa</b>: no Kinder/Fund. I era a família sobre o professor. Aqui, pelo desenho da pesquisa, há nota externa para <b>Tutoria</b> (alunos: 5 perguntas; famílias: 1 pergunta, atribuída ao tutor) <b>Idioma</b> (alunos, escala 0–4) e <b>Citações</b> (alunos, todos os professores com ≥ 10 respondentes). As demais perguntas de famílias falam da escola e <b>não</b> entram.</li><li><b>Citações dos alunos</b> (blocos 1 a 3) são só positivas. Viram um percentil entre professores ativos do segmento e entram na voz externa como <b>nota de citação = 70 + 0,3 × percentil</b> (elegível com ≥ 10 alunos respondentes). Não geram nota por dimensão. O painel de reconhecimento (IRD) foi retirado deste HTML e será feito à parte; o cálculo segue na planilha de referência.</li><li><b>Comentários abertos</b>: viram síntese qualitativa (temas), sem nota e sem penalização.</li></ul></div>';
  h+='<div class="box"><h2>3. Regras de cálculo usadas</h2><table class="rtab"><tbody><tr><td>Coordenação bruta (C)</td><td>média das respostas válidas de todas as avaliadoras, por professor (cada pergunta uma vez por avaliadora)</td></tr><tr><td>Coordenação ajustada</td><td>C − viés médio das avaliadoras (ponderado pelo nº de respostas de cada uma), limitada a 0–100</td></tr><tr><td>Voz externa (V)</td><td>média das fontes externas elegíveis (Tutoria, Idioma e Citações). Em Tutoria: média simples entre alunos e famílias quando ambos existem. Tutoria e Idioma exigem ≥ 5 respondentes (alunos distintos + famílias; em Idioma, alunos); Citações exigem ≥ 10 alunos respondentes</td></tr><tr><td>Nota da coordenação</td><td>Coordenação ajustada (C bruta − viés médio ponderado das avaliadoras), exibida separada do índice</td></tr><tr><td>Nota das famílias e alunos</td><td>Voz externa (V): média simples das fontes externas elegíveis, exibida separada do índice</td></tr><tr><td>Índice Final completo</td><td>Base − Perda 1 − Perda 2, com Base = 0,5·C ajustada + 0,5·V (professores com V elegível)</td></tr><tr><td>Índice Final parcial</td><td>C ajustada, sem V. Rotulado como parcial; <b>não</b> entra em comparação direta com o completo (nenhum caso no ciclo atual, pois as citações cobrem quase todos)</td></tr><tr><td>Dados insuficientes</td><td>&lt; 2 avaliadoras ou sem autoavaliação, ou desligado/afastado</td></tr><tr><td>Nota da dimensão</td><td>0,5·C ajustada da dimensão + 0,5·V da dimensão (se V elegível); senão C ajustada</td></tr><tr><td>Nota de citação</td><td>taxa = citações recebidas ÷ (alunos respondentes do professor × 10 perguntas); percentil entre professores ativos do segmento com ≥ 10 respondentes; nota = 70 + 0,3 × percentil</td></tr><tr><td>Tamanho de amostra</td><td>Alta: coordenação ≥ 3 avaliadoras e ≥ 40 respostas; alunos/famílias ≥ 10 (tutoria/idioma) ou ≥ 20 (citações). Abaixo disso, o indicador aparece com aviso ou “dados insuficientes”</td></tr></tbody></table></div>';
  h+='<div class="box"><h2>4. Calibragem das avaliadoras (verificação da metodologia existente)</h2><div class="wrap"><table class="rtab"><thead><tr><th>Avaliadora</th><th>Bloco avaliado</th><th class="n">Respostas</th><th class="n">Professores</th><th class="n">Média</th><th class="n">Viés (método F1)</th><th class="n">Viés por pergunta (diagnóstico)</th></tr></thead><tbody>'+M.avals.slice().sort((a,b)=>a.vies-b.vies).map(a=>'<tr><td>'+esc(a.nome)+'</td><td>'+esc(DN[a.bloco]||a.bloco)+'</td><td class="n">'+a.n+'</td><td class="n">'+a.nprof+'</td><td class="n">'+fmt(a.mean)+'</td><td class="n">'+(a.vies>0?'+':'')+fmt(a.vies)+'</td><td class="n">'+(a.viesPerg>0?'+':'')+fmt(a.viesPerg)+'</td></tr>').join('')+'</tbody></table></div><ul><li><b>Aplicada nos segmentos anteriores?</b> Sim: mesma lógica (viés por avaliadora, ajuste de 100%). Foi mantida para garantir continuidade.</li><li><b>Distorções identificadas:</b> (i) cada avaliadora responde a <i>um</i> bloco, então o viés misturar severidade com diferença natural de dificuldade entre blocos; (ii) as avaliadoras atendem a um só segmento/unidade, de modo que o viés pode absorver diferenças reais entre equipes; (iii) as amplitudes são grandes (de '+fmt(Math.min(...M.avals.map(a=>a.vies)))+' a +'+fmt(Math.max(...M.avals.map(a=>a.vies)))+' pts), o que torna o ajuste relevante.</li><li><b>Aperfeiçoamento proposto (provisório):</b> manter o método F1 como oficial e acompanhar o “viés por pergunta” (compara a avaliadora com as demais nas <i>mesmas</i> perguntas) como diagnóstico; se a diferença entre os dois métodos persistir, recomendar uma calibragem presencial entre avaliadoras antes de ajustar estatisticamente. A nota bruta permanece visível em todos os relatórios.</li></ul></div>';
  h+='<div class="box"><h2>5. Qualidade e confiabilidade dos dados</h2><div class="stat"><div><b>'+T+'</b><span>professores nas fontes (F2/EM)</span></div><div><b>'+A+'</b><span>ativos</span></div><div><b>'+sum(p=>p.coord.n)+'</b><span>respostas válidas da coordenação</span></div><div><b>'+sum(p=>p.auto.n)+'</b><span>respostas de autoavaliação</span></div><div><b>'+sum(p=>p.tut.n)+'</b><span>respostas de tutoria dos alunos</span></div><div><b>'+sum(p=>p.idi.n)+'</b><span>respostas de idioma dos alunos</span></div><div><b>'+sum(p=>p.fam.n)+'</b><span>respostas de famílias (via tutor)</span></div><div><b>'+sum(p=>p.rec.n)+'</b><span>citações nominais atribuídas</span></div><div><b>'+sum(p=>p.com.nCom)+'</b><span>trechos de comentários atribuídos a professores</span></div></div><ul>'+''+''+(OWN?'':'<li><b>Vínculo professor × segmento × unidade</b> conforme a base funcional do RH. Galileu, Gustavo e Marlon lecionam nos dois segmentos, mas só têm coordenação no Fund. II: dados reunidos numa linha. Nathan, Patricia e Octávio têm coordenação nos dois segmentos: duas linhas.</li>')+'<li><b>Desligados/afastados:</b> '+PR.filter(p=>!ativo(p)).map(p=>esc(tc(p.nome))).join(', ')+' — fora do quadro; notas mantidas nas médias.</li>'+(OWN?'':'<li><b>Coordenador citado pelos alunos</b> (Marcos Leandro Matias Morris) removido da lista de professores ('+17+' citações).</li>')+'<li><b>Comentários abertos:</b> atribuição por nome/apelido dentro da unidade e do segmento do aluno; nomes ambíguos ('+D.cmeta.amb+' ocorrências) não foram atribuídos; trechos sem nome de professor ('+D.cmeta.nGeral+') ficaram sem atribuição. A classificação de tema e polaridade é automática (palavras-chave) e <b>precisa de revisão humana</b>.</li><li><b>Perguntas não comparáveis:</b> escala do Idioma (0–4) × frequência da coordenação; pergunta de famílias sobre tutoria é dupla (conhecer + comunicar). Comparações entre escalas distintas ficam sinalizadas.</li><li><b>Exposição:</b> professores com poucos alunos respondentes ficam sem a fonte de citações (&lt; 10) e, em Tutoria/Idioma, sem a fonte correspondente (&lt; 5).</li></ul></div>';
  h+='<div class="box"><h2>6. Decisões de homologação</h2><p class="foot"><b>Aprovadas pela coordenação em 28/10/2026 (aplicadas neste painel, ainda sujeitas à homologação institucional formal):</b></p><ol><li><b>Composição do Índice Final</b>: 50% coordenação ajustada + 50% voz externa, só para quem tem voz externa elegível.</li><li><b>Perda por desalinhamento</b> (tolerância 10, fator 0,5) comparando a coordenação geral com a voz externa.</li><li><b>Viés da avaliadora</b> do Fund. I mantido (diagnóstico alternativo na tabela de calibragem).</li><li><b>Citações dos alunos</b> incluídas como fonte da voz externa (70 + 0,3 × percentil).</li></ol><p class="foot"><b>Ainda dependem de decisão institucional:</b></p><ol start="5"><li><b>Tutoria como dimensão própria</b> (sem prejudicar quem não é tutor): entra apenas por respostas válidas da coordenação e da voz externa.</li><li>Tratar a pergunta dupla de famílias sobre o tutor como está, até haver separação nos instrumentos.</li><li>Uso dos <b>comentários</b>: só síntese e roteiro de feedback; relatos sensíveis em fluxo reservado.</li><li>Calibragem: manter método F1 e acompanhar o diagnóstico por pergunta.</li><li>Critério de mínimo de respondentes (≥ 5 externos; ≥ 10 para citações) e data de corte para professores admitidos recentemente.</li><li>Reconhecimento (IRD) como painel separado: fora deste HTML por decisão da coordenação.</li></ol></div>';
  h+='<div class="box"><h2>7. Limitações</h2><ul><li>A voz de estudantes e famílias só chega a tutores e professores de idioma; para os demais, o Índice Final é só da coordenação.</li><li>Número reduzido de famílias por tutor (cobertura parcial), e uma única pergunta.</li><li>Viés confundido com bloco/equipe (ver calibragem).</li><li>Comentários: amostra pequena por professor (poucos têm ≥ 5 menções); classificação automática; risco de identificação indireta de estudantes.</li><li>Sem histórico anterior para F2/EM: não há evolução de desempenho comparável.</li></ul></div>';
  h+='<div class="box"><h2>8. Funcionalidades — o que opera neste HTML e o que não opera</h2><div class="two"><div><b>Operantes</b><ul><li>Lista de professores ativos (cards ou tabela) com filtros por segmento e unidade</li><li>Diagnóstico individual com fontes, blocos, eixos e perguntas</li><li>Voz dos alunos (citações e síntese de comentários)</li><li>Tutoria e famílias</li><li>Roteiro de feedback e PDI SMART editáveis</li><li>Relatório do professor (não editável) e impressão/PDF por documento</li><li>Critérios de elegibilidade visíveis em cada Índice Final</li></ul></div><div><b>Limitadas (sem infraestrutura)</b><ul><li>Registro de devolutiva e acompanhamento: não há neste painel (retirado)</li><li>Edições nos campos pontilhados valem para a impressão da sessão; não são gravadas automaticamente</li><li>Controle de acesso, histórico entre ciclos e múltiplos usuários exigem servidor (não simulado)</li></ul></div></div><p class="foot">Privacidade: não publicar este arquivo em endereço público. Ele contém resultados individuais e sínteses de comentários de estudantes menores de idade.</p></div>';
  return h;
}
// ---------- impressão por documento
function printDoc(k){
  const el=document.getElementById('doc-'+k);if(!el)return;
  const cl=el.cloneNode(true);
  el.querySelectorAll('select').forEach((s,i)=>{const o=cl.querySelectorAll('select')[i];if(o)[...o.options].forEach((op,j)=>{if(s.options[j].selected)op.setAttribute('selected','')})});
  if(k==='rel')cl.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));
  cl.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));
  cl.querySelectorAll('.ed').forEach(x=>x.classList.remove('ed'));
  $('#modal').innerHTML='<div class="mb"><div class="mt noprint"><h2>Imprimir</h2><span class="sp" style="flex:1"></span><button id="mp">🖨 Imprimir / PDF</button><button id="mx">Fechar</button></div><div class="mc acao-doc">'+cl.innerHTML+'</div></div>';
  $('#modal').classList.add('open');
  $('#mx').onclick=closeDoc;$('#mp').onclick=()=>{document.body.classList.add('print-modal');window.print()};
  window.onafterprint=()=>document.body.classList.remove('print-modal');
}
function setPrintTheme(on){const r=document.documentElement;if(on){if(window.__pt===undefined)window.__pt=r.getAttribute('data-theme');r.setAttribute('data-theme','light')}else if(window.__pt!==undefined){if(window.__pt===null)r.removeAttribute('data-theme');else r.setAttribute('data-theme',window.__pt);window.__pt=undefined}}
window.addEventListener('beforeprint',()=>{if(document.body.classList.contains('print-modal'))setPrintTheme(true)});
window.addEventListener('afterprint',()=>{setPrintTheme(false)});
function closeDoc(){$('#modal').classList.remove('open');$('#modal').innerHTML='';document.body.classList.remove('print-modal')}

// ---------- memória de cálculo ("Como foi calculado")
function calcHTML(k,p){
  const i=p.idp,cd=p.coord,F=x=>fmt(x,2),sg=x=>(x>0?'+':'')+F(x);
  const T=(head,rows)=>{const L=head.map((x,n)=>!n||x[0]==='~');return '<div class="wrap"><table class="rtab"><thead><tr>'+head.map((x,n)=>'<th'+(L[n]?'':' class="n"')+'>'+x.replace('~','')+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map((x,n)=>'<td'+(L[n]?'':' class="n"')+'>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'};
  let h='';
  if(k==='c'){
    const sw=cd.avals.reduce((a,x)=>a+x.n*x.vies,0),sn=cd.avals.reduce((a,x)=>a+x.n,0),vp=sn?sw/sn:null;
    h+='<p>A <b>nota da coordenação</b> vem das respostas das coordenadoras que avaliaram este professor (escala convertida para 0–100). Como cada avaliadora tem um rigor próprio, a nota é <b>ajustada</b> pelo viés de quem avaliou.</p>';
    h+='<h3>Passo 1 · Nota bruta</h3><p>Média das <b>'+cd.n+'</b> respostas válidas de <b>'+cd.nAval+'</b> avaliadora(s), cada pergunta contada uma vez por avaliadora: <b>'+F(cd.Cb)+'</b>.</p>';
    h+='<h3>Passo 2 · Viés das avaliadoras</h3>'+T(['Avaliadora','Respostas sobre este professor','Viés da avaliadora','Respostas × viés'],cd.avals.map(a=>[esc(a.nome),a.n,sg(a.vies),F(a.n*a.vies)]).concat([['<b>Total</b>','<b>'+sn+'</b>','','<b>'+F(sw)+'</b>']]))+'<p>Viés de cada avaliadora = média dela em todas as respostas − média geral da coordenação no F2/EM ('+F(M.gMean)+'). Viés médio ponderado = '+F(sw)+' ÷ '+sn+' = <b>'+sg(vp)+'</b>.</p>';
    h+='<h3>Passo 3 · Nota ajustada</h3><p>Nota da coordenação = bruta − viés = '+F(cd.Cb)+' − ('+sg(cd.vies)+') = <b>'+F(cd.Cadj)+'</b> (limitada a 0–100).</p>';
    h+='<div class="box"><b>Onde entram as perdas:</b> esta nota vale 50% da Base do Índice Final.'+(i.tipo==='completo'?' A <b>Perda 1</b> compara esta nota com a das famílias e alunos: diferença '+F(i.gap1)+' pts, tolerância 10, perda <b>'+F(i.perda1)+'</b>. A nota acima é mostrada antes das perdas.':' Sem Índice Final completo, não há perdas a aplicar.')+'</div>';
    if(cd.nAval<2)h+='<div class="warn">Menos de 2 avaliadoras: a nota é informativa e não gera Índice Final.</div>';
  }else if(k==='v'){
    const E=p.ext||{},nm={TUTORIA:'Tutoria',IDIOMA:'Idioma',CITAÇÕES:'Citações dos alunos'},rows=[],okv=[];
    Object.entries(E).forEach(([q,e])=>{
      let det='';
      if(q==='TUTORIA')det=(p.tut.m!=null?'Alunos '+F(p.tut.m)+' ('+p.tut.resp+' alunos)':'')+(p.tut.m!=null&&p.fam.m!=null?' e ':'')+(p.fam.m!=null?'Famílias '+F(p.fam.m)+' ('+p.fam.n+' resp.)':'')+(p.tut.m!=null&&p.fam.m!=null?' → média simples':'');
      else if(q==='IDIOMA')det='Alunos, escala 0–4 convertida para 0–100';
      else det='Taxa '+pct(p.rec.taxa)+' · percentil '+Math.round(p.rec.pct||0)+' → 70 + 0,3 × '+Math.round(p.rec.pct||0);
      rows.push([nm[q]||q,det,e.resp,F(e.V),e.ok?'sim':'não (mín. '+(q==='CITAÇÕES'?10:5)+')']);
      if(e.ok)okv.push(e.V);
    });
    h+='<p>A <b>nota das famílias e alunos</b> (voz externa, V) reúne só as perguntas em que alunos e famílias <b>avaliam o professor</b>. Perguntas sobre a escola não entram.</p>';
    h+='<h3>Fontes</h3>'+(rows.length?T(['Fonte','~Como foi obtida','Respondentes','Nota','Entra?'],rows):'<p>Este professor não tem fonte externa vinculada.</p>');
    h+='<h3>Resultado</h3><p>V = média simples das fontes que entram'+(okv.length?': ('+okv.map(F).join(' + ')+') ÷ '+okv.length+' = <b>'+F(okv.reduce((a,b)=>a+b,0)/okv.length)+'</b>.':'. Nenhuma fonte elegível: sem nota.')+'</p>';
    h+='<div class="box"><b>Onde entram as perdas:</b> esta nota vale 50% da Base do Índice Final.'+(i.tipo==='completo'?' Na <b>Perda 1</b>, a diferença para a coordenação foi de '+F(i.gap1)+' pts (tolerância 10), perda <b>'+F(i.perda1)+'</b>. A nota acima é mostrada antes das perdas.':' Sem Índice Final completo, não há perdas a aplicar.')+'</div>';
  }else{
    h+='<p>O <b>Índice Final</b> combina as duas notas e desconta perdas quando as fontes divergem muito. As perdas só descontam, nunca somam.</p>';
    if(i.tipo!=='completo'){return h+'<div class="warn"><b>'+esc(idpLab(p))+'</b>'+(i.motivo?' — '+esc(i.motivo):'')+'. Por isso o Índice Final completo não é calculado para este professor.</div>'}
    const b=0.5*i.Cadj+0.5*i.V,l1=Math.max(0,Math.abs(i.Cadj-i.V)-10)*0.5,l2=Math.max(0,Math.abs(p.auto.A-b)-10)*0.5;
    h+=T(['Passo','~Conta','Resultado'],[
      ['1 · Nota da coordenação (C)','coordenação ajustada',F(i.Cadj)],
      ['2 · Nota das famílias e alunos (V)','média das fontes externas elegíveis',F(i.V)],
      ['3 · Base','0,5 × '+F(i.Cadj)+' + 0,5 × '+F(i.V),'<b>'+F(b)+'</b>'],
      ['4 · Perda 1 (C × V)','diferença |'+F(i.Cadj)+' − '+F(i.V)+'| = '+F(i.gap1)+(i.gap1>10?'; excesso '+F(i.gap1-10)+' × 0,5':'; dentro de 10'),'<b>'+(l1>0?'−':'')+F(l1)+'</b>'],
      ['5 · Perda 2 (autoavaliação × Base)','autoavaliação '+F(p.auto.A)+'; |'+F(p.auto.A)+' − '+F(b)+'| = '+F(i.gap2)+(i.gap2>10?'; excesso '+F(i.gap2-10)+' × 0,5':'; dentro de 10'),'<b>'+(l2>0?'−':'')+F(l2)+'</b>'],
      ['6 · Índice Final','Base − Perda 1 − Perda 2 = '+F(b)+' − '+F(l1)+' − '+F(l2),'<b>'+F(b-l1-l2)+'</b>']]);
    h+='<p>Média do segmento: <b>'+F(M.grp[p.seg].final)+'</b>. Semáforo: vermelho &lt; 85 · amarelo 85–89,9 · verde ≥ 90.</p>';
    h+='<div class="box"><b>Regras:</b> perda 1 = 0,5 × (|C − V| − 10), mínimo zero. Perda 2 = 0,5 × (|autoavaliação − Base| − 10), mínimo zero. A autoavaliação não soma pontos: só pode reduzir o índice. Exige ≥ 2 avaliadoras, autoavaliação e fonte externa elegível.</div>';
    if(Math.abs((b-l1-l2)-i.final)>0.005)h+='<div class="warn">Conferência: diferença entre o cálculo desta tela e o valor do painel.</div>';
  }
  return h;
}
function calcOpen(k,id){
  const p=PR[id],t={f:'Índice Final',v:'Nota das famílias e alunos',c:'Nota da coordenação'}[k];
  $('#modal').innerHTML='<div class="mb"><div class="mt noprint"><h2>Como foi calculado · '+t+' · '+esc(tc(p.nome))+'</h2><span class="sp" style="flex:1"></span><button id="mp">🖨 Imprimir / PDF</button><button id="mx">Fechar</button></div><div class="mc calc">'+calcHTML(k,p)+'</div></div>';
  $('#modal').classList.add('open');
  $('#mx').onclick=closeDoc;$('#mp').onclick=()=>{document.body.classList.add('print-modal');window.print()};
  window.onafterprint=()=>document.body.classList.remove('print-modal');
}
// ---------- eventos
function bind(){
  const v=$('#view');
  v.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>calcOpen(b.dataset.calc,+b.dataset.id));
  v.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openProf(+b.dataset.open));
  v.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});
  v.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>printDoc(b.dataset.print));
  v.querySelectorAll('[data-f]').forEach(e=>e.onchange=e.oninput=()=>{const k=e.dataset.f;
    if(k==='selp'){S.sel=+e.value;render();return}
    S[k]=e.type==='checkbox'?e.checked:e.value;
    if(k==='fq'){const pos=e.selectionStart;render();const n=$('[data-f=fq]');n.focus();n.setSelectionRange(pos,pos);return}
    render()});
  v.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{const [k,val]=b.dataset.set.split(':');S[k]=val;render()});
  v.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;
    if(a==='back'){S.view='prof';render()}
    if(a==='met'){S.view='met';render()}});
}
render();
</script>
